[project]
name = "live-engagement-coach"
version = "0.1.0"
description = "Live Engagement Coach backend"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "SQLAlchemy[asyncio]>=2.0.34",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "httpx>=0.27.2",
  "cryptography",
  "websockets>=13.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0",
  "orjson>=3.10.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "respx>=0.21.1",
  "ruff>=0.6.4",
  "mypy>=1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_engagement_coach"]
